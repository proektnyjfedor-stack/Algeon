name: math_pilot
description: Algeon — математический тренажёр для 1–11 класса
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.3 <4.0.0'
  flutter: '>=3.38.4'

dependencies:
  flutter:
    sdk: flutter

  # Локальное хранение
  shared_preferences: ^2.2.2

  # Роутинг
  go_router: ^17.1.0

  # State management
  provider: ^6.1.0

  # Рендеринг LaTeX-формул (дроби, степени, корни)
  flutter_math_fork: ^0.7.2

  # Выбор фото из галереи
  image_picker: ^1.1.2

  # Web interop (replaces deprecated dart:html)
  web: ^1.1.0

  # Звуковые эффекты (web / iOS / Android)
  audioplayers: ^6.1.0
  cupertino_icons: ^1.0.9
  html: 0.15.7
  flutter_widget_from_html_core: 0.17.4
  flutter_svg: 2.2.4
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: 2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/exams/catalog.json
    - assets/exams/images/
