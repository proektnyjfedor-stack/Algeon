name: 🚀 Deploy Web to Firebase Hosting

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'web_landing/**'
      - 'tool/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'test/**'
      - 'firebase.json'
      - '.github/workflows/deploy-web.yml'

jobs:
  deploy:
    name: Build & Deploy Flutter Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Test release packaging
        run: python3 -m unittest discover -s tool -p 'test_*.py' -v

      # CanvasKit с того же origin — иначе блокировщики (gstatic) дают пустой экран в Safari
      - name: Build Web (release, local CanvasKit)
        run: bash tool/build_web.sh

      - name: Check hosting credentials
        id: credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Build verified. Hosting deployment skipped: FIREBASE_SERVICE_ACCOUNT is not configured."
          fi

      - name: Deploy to Firebase Hosting
        if: steps.credentials.outputs.available == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: algeon-66295
